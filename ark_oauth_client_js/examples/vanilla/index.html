<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ark SPA demo (vanilla JS)</title>
    <link rel="stylesheet" href="/examples/vanilla/style.css" />
    <script type="module" src="/examples/vanilla/app.js"></script>
  </head>
  <body>
    <main id="app">
      <h1>Ark SPA demo <small>vanilla JS, no build</small></h1>
      <p id="status" data-status="loading">Loading…</p>
      <section id="user" hidden>
        <p>Signed in as <strong id="email"></strong></p>
        <p>Ark claims: <code id="claims"></code></p>
        <p>Access token expires: <span id="expires"></span></p>
      </section>
      <div class="actions">
        <button id="signin">Sign in</button>
        <button id="signin-popup">Sign in with a popup</button>
        <button id="userinfo">Call /userinfo</button>
        <button id="refresh">Refresh now</button>
        <button id="switch">Sign in as a different user</button>
        <button id="signout">Sign out</button>
        <button id="signout-local">Sign out of this app only</button>
        <button id="setup">Check setup</button>
      </div>
      <pre id="output"></pre>
      <h2>Events</h2>
      <ol id="events"></ol>
    </main>
    <div id="denied"></div>
  </body>
</html>
