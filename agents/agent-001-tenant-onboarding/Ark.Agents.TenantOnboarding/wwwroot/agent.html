<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>{{AGENT}} · identity server setup</title>
    <link rel="stylesheet" href="{{BASE}}/assets/agent.css" />
</head>
<body data-base="{{BASE}}" data-agent="{{AGENT}}">
    <svg class="sprite" aria-hidden="true" focusable="false">
        <symbol id="i-lock" viewBox="0 0 24 24"><path d="M7 10V7a5 5 0 0 1 10 0v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="4.5" y="10" width="15" height="10.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="15.2" r="1.5" fill="currentColor"/></symbol>
        <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12l15.5-7.5-5 16-3.2-6.3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M11.3 14.2l8.2-9.7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
        <symbol id="i-clip" viewBox="0 0 24 24"><path d="M20 11.5l-8.2 8.2a5 5 0 0 1-7.1-7.1l8.6-8.6a3.4 3.4 0 0 1 4.8 4.8l-8.5 8.5a1.8 1.8 0 0 1-2.5-2.5l7.6-7.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M16 5.3a3.5 3.5 0 0 1 0 6.4M18 14.2a6.5 6.5 0 0 1 3.5 5.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
        <symbol id="i-pilot" viewBox="0 0 32 32"><circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="16" cy="16" r="2.6" fill="currentColor"/><path d="M16 2v8M16 22v8M2 16h8M22 16h8M6.1 6.1l5.7 5.7M20.2 20.2l5.7 5.7M25.9 6.1l-5.7 5.7M11.8 20.2l-5.7 5.7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    </svg>

    <header class="top">
        <div class="brand">
            <span class="mark"><svg><use href="#i-pilot"></use></svg></span>
            <div>
                <strong id="agent-name">{{AGENT}}</strong>
                <span id="subtitle">Setting up this identity server</span>
            </div>
        </div>
        <div class="top-right">
            <span class="chip" id="model-chip" hidden></span>
            <button class="ghost only-narrow" id="board-toggle" type="button" hidden>Setup board</button>
            <a class="ghost" id="wizard-link" hidden>Use the classic wizard</a>
        </div>
    </header>

    <!-- Before the conversation: starting, the setup code, a name. -->
    <main class="gate" id="gate" hidden>
        <div class="gate-card" id="gate-card"></div>
    </main>

    <main class="work" id="work" hidden>
        <section class="chat" aria-label="Conversation">
            <div class="notice" id="notice" hidden></div>
            <div class="messages" id="messages" aria-live="polite"></div>
            <div class="typing" id="typing" hidden><span></span><span></span><span></span><em id="typing-note"></em></div>
            <form class="composer" id="composer">
                <div class="drop-hint" id="drop-hint" hidden>Drop a text file: I will read it and file what it says</div>
                <textarea id="input" rows="1" placeholder="Tell me about your setup, or paste an email, a ticket, a connection string…" aria-label="Message"></textarea>
                <div class="composer-row">
                    <div class="composer-tools">
                        <button type="button" class="tool" id="attach" title="Attach a text file (.txt, .env, .json, .md, .eml)"><svg><use href="#i-clip"></use></svg><span>Attach</span></button>
                        <button type="button" class="tool" id="secret-open" title="Give me a password or key without it entering the conversation"><svg><use href="#i-lock"></use></svg><span>Send a secret</span></button>
                        <input type="file" id="file" hidden accept=".txt,.env,.json,.md,.eml,.yml,.yaml,.ini,.config,.csv,.log,text/*" />
                    </div>
                    <button type="submit" class="primary send" id="send"><span>Send</span><svg><use href="#i-send"></use></svg></button>
                </div>
            </form>
        </section>

        <aside class="board" id="board" aria-label="Setup board"></aside>
    </main>

    <main class="handover" id="handover" hidden></main>

    <div class="sheet-back" id="sheet-back" hidden>
        <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
    </div>
    <div class="toast" id="toast" hidden role="status"></div>

    <script src="{{BASE}}/assets/agent.js"></script>
</body>
</html>
