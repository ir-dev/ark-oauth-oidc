# Release: build, test and publish the reusable packages at ONE version, then record it as a
# GitHub release.
#
#   NuGet  Ark.oAuth.Oidc, Ark.oAuth.Client   Ark.oAuth.Oidc/Ark.oAuth.{Oidc,Client}
#   PyPI   ark-oauth-client                    ark_oauth_client_py
#   npm    ark-oauth-client-node (Node)        ark_oauth_client_nodejs   build-node -> publish-npm-node
#   npm    ark-oauth-client-js   (browser)     ark_oauth_client_js       build-js   -> publish-npm-js
#
# The two npm packages are separate libraries with separate jobs, artifacts and trusted
# publishers: each is checked against the registry, published and reported on its own, so one
# being live already (or failing) says nothing about the other.
#
# HOW TO RELEASE
#   1. Write the notes under "Next release" (the heading in each CHANGELOG.md, the first line of
#      the entry in each <PackageReleaseNotes>), commit and push.
#   2. Actions -> Release -> Run workflow, on that branch. Nothing needs typing: the run takes
#      the next version by itself. Tick "dry run" to build and test without publishing.
#
# The version is worked out by the run, unless one is typed into it:
#   automatic  `scripts/version.sh next <bump>`: the highest vX.Y.Z tag with one part raised,
#              the patch number unless the run asks for minor or major (2.4.1 -> 2.4.2, 2.5.0 or
#              3.0.0). Manifests somebody has already set past that are released as they stand.
#              A commit that is already released is refused, so a second click or "Re-run all
#              jobs" does not publish the same code again under the next number.
#   typed      exactly that version, whatever the tags and the manifests say.
# `scripts/version.sh stamp X.Y.Z` then writes it into every csproj, pyproject.toml, __init__.py
# and package.json, and over the "Next release" heading of the notes, on each runner before
# building. Nothing is committed, so git describes the release before this one until the same
# `stamp` is run locally and committed (the run's summary says when that is owed). Do it before
# writing notes for the release after: notes left under "Next release" are released again under
# the next number. The tag and the GitHub release are the record of what went out.
#
# A version is consumed only by a registry accepting it, so a failed run, a dry run or a re-run
# burns nothing: the tag is what raises the next number, and it comes last. A registry that
# already has the version is skipped, not failed, so a half-finished release can be finished by
# re-running ("Re-run failed jobs" reuses the artifacts already built and published) or by a new
# run, which works out the same number. The tag vX.Y.Z is created by the GitHub release, LAST,
# so a tag never names something unpublished.
#
# ONE-TIME SETUP -- no tokens anywhere; all three registries use Trusted Publishing (OIDC).
# Every registry is given the same four values: owner ir-dev, repository ark-oauth-oidc,
# workflow release.yml, environment release.
#   a. GitHub: Settings -> Environments -> New environment "release". Add yourself as a required
#      reviewer and/or restrict it to main if you want a click before anything leaves.
#   b. nuget.org: your profile menu -> Trusted Publishing -> Create policy.
#      Then GitHub: Settings -> Secrets and variables -> Actions -> Variables ->
#      NUGET_USER = your nuget.org profile name (the user name, not the email).
#   c. PyPI: pypi.org/manage/project/ark-oauth-client/settings/publishing -> add a GitHub publisher.
#   d. npm: one trusted publisher PER PACKAGE, ark-oauth-client-node and ark-oauth-client-js, each
#      with the same four values: npmjs.com -> the package -> Settings -> Trusted publisher, and
#      tick "npm publish" under Allowed actions (new publishers allow only `npm stage publish`).
#      npm offers a trusted publisher only on a package that exists, so a package's first version
#      is published by hand (`npm publish --access public` in its folder). ark-oauth-client-js
#      exists. The Node client was published as ark-oauth-client up to 2.1.8 and renamed to
#      ark-oauth-client-node in 2.2.0, so ark-oauth-client-node needs that first hand publish and
#      its own publisher. The old ark-oauth-client is deprecated, not published by this workflow.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Automatic version: the part of the last release's number to raise. Ignored when a version is typed below."
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: "Exact version to release instead, X.Y.Z (optional). Blank = automatic."
        required: false
        default: ""
      dry_run:
        description: "Dry run: build, test and verify only; publish nothing, tag nothing."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      nuget_live: ${{ steps.live.outputs.nuget }}
      pypi_live: ${{ steps.live.outputs.pypi }}
      npm_node_live: ${{ steps.live.outputs.npm_node }}
      npm_js_live: ${{ steps.live.outputs.npm_js }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The version to release
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        # The version is stamped here too, so a bad one (not X.Y.Z, or a manifest the stamp
        # cannot find) fails before anything builds; the build jobs repeat the stamp on their own
        # checkout. Assign rather than `echo "...$(cmd)"`, which swallows a failing check's exit
        # code and hands every later job an empty VERSION. The script's own reason is raised as
        # an annotation, since stderr alone shows only "exit code N" on the run summary.
        run: |
          fail() {
            cat "$RUNNER_TEMP/version.err" >&2
            reason=$(grep '^error:\|^no match\|^usage:' "$RUNNER_TEMP/version.err" | head -1 | sed 's/^error: //')
            echo "::error::${reason:-$1} (version input was '$REQUESTED', bump '$BUMP')"
            exit 1
          }
          requested=$(printf '%s' "$REQUESTED" | tr -d '[:space:]')
          requested=${requested#v}
          how="typed into the run"
          if [ -z "$requested" ]; then
            requested=$(scripts/version.sh next "${BUMP:-patch}" 2>"$RUNNER_TEMP/version.err") || fail "scripts/version.sh next failed"
            cat "$RUNNER_TEMP/version.err" >&2
            # Without the tags the last release is unknown, and a guess here is a version number
            # spent on five registries.
            if grep -q '^warning: origin cannot be reached' "$RUNNER_TEMP/version.err"; then
              echo "::error::The tags on origin could not be listed, so the last release is unknown. Run again, or type the version."
              exit 1
            fi
            how=$(sed -n 's/^next: [^ ]* (\(.*\))$/automatic, \1/p' "$RUNNER_TEMP/version.err")
          fi
          scripts/version.sh stamp "$requested" 2>"$RUNNER_TEMP/version.err" || fail "scripts/version.sh stamp failed"
          version=$(scripts/version.sh check "$requested" 2>"$RUNNER_TEMP/version.err") || fail "scripts/version.sh check failed"
          cat "$RUNNER_TEMP/version.err" >&2
          [ -n "$version" ] || { echo "::error::scripts/version.sh check printed no version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "how=$how" >> "$GITHUB_OUTPUT"

      - name: Not released yet
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          REQUESTED: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        # An automatic version is always a free one, so it cannot stop "Re-run all jobs" or a second
        # click from releasing one commit twice. The tags do: a released commit carries one.
        run: |
          tag="v$VERSION"
          problem=""
          if [ -z "$(printf '%s' "$REQUESTED" | tr -d '[:space:]')" ]; then
            tags=$(git ls-remote --tags origin 'v*')
            done_as=$(printf '%s\n' "$tags" | sed -nE "s#^$GITHUB_SHA[[:space:]]+refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)(\^\{\})?\$#\1#p" | tail -1)
            if [ -n "$done_as" ]; then
              problem="This commit is already released as $done_as, so there is nothing new to release. To release it again anyway, type a version."
            fi
          fi
          if [ -n "$problem" ]; then
            :
          elif gh release view "$tag" >/dev/null 2>&1; then
            problem="GitHub release $tag already exists. Leave the version blank to release the one after the last."
          else
            at=$(git ls-remote origin "refs/tags/$tag^{}" "refs/tags/$tag" | head -1 | cut -f1)
            if [ -n "$at" ] && [ "$at" != "$GITHUB_SHA" ]; then
              problem="tag $tag already exists at $at, not at $GITHUB_SHA."
            fi
          fi
          if [ -n "$problem" ]; then
            if [ "$DRY_RUN" = "true" ]; then echo "::warning::$problem"; else echo "::error::$problem"; exit 1; fi
          fi
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::warning::Releasing from $GITHUB_REF_NAME, not main. The csproj files declare RepositoryBranch=main."
          fi

      - name: What the registries already have
        id: live
        env:
          VERSION: ${{ steps.version.outputs.version }}
          HOW: ${{ steps.version.outputs.how }}
        run: |
          # 200 -> true, 404 -> false, anything else stops the run rather than guessing.
          live() {
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$1")
            case "$code" in
              200) echo true ;;
              404) echo false ;;
              *) echo "::error::$1 answered HTTP $code" >&2; return 1 ;;
            esac
          }
          oidc=$(live "https://api.nuget.org/v3-flatcontainer/ark.oauth.oidc/$VERSION/ark.oauth.oidc.nuspec")
          client=$(live "https://api.nuget.org/v3-flatcontainer/ark.oauth.client/$VERSION/ark.oauth.client.nuspec")
          pypi=$(live "https://pypi.org/pypi/ark-oauth-client/$VERSION/json")
          npm_node=$(live "https://registry.npmjs.org/ark-oauth-client-node/$VERSION")
          npm_js=$(live "https://registry.npmjs.org/ark-oauth-client-js/$VERSION")
          for pkg in ark-oauth-client-node:node ark-oauth-client-js:js; do
            if [ "$(live "https://registry.npmjs.org/${pkg%%:*}")" = false ]; then
              echo "::warning::${pkg%%:*} has never been published to npm; publish-npm-${pkg#*:} will stop until the first version is published by hand (setup step d)."
            fi
          done
          # Both NuGet packages are pushed together; --skip-duplicate covers one being live already.
          nuget=$([ "$oidc" = true ] && [ "$client" = true ] && echo true || echo false)
          {
            echo "nuget=$nuget"
            echo "pypi=$pypi"
            echo "npm_node=$npm_node"
            echo "npm_js=$npm_js"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release $VERSION from \`${GITHUB_SHA::7}\` ($GITHUB_REF_NAME)"
            echo
            echo "Version: $HOW."
            echo
            echo "| Package | Already on the registry? |"
            echo "|---|---|"
            echo "| NuGet Ark.oAuth.Oidc | $oidc |"
            echo "| NuGet Ark.oAuth.Client | $client |"
            echo "| PyPI ark-oauth-client | $pypi |"
            echo "| npm ark-oauth-client-node (Node) | $npm_node |"
            echo "| npm ark-oauth-client-js (browser) | $npm_js |"
            echo
            echo "Packages already live are built and tested, but not published or attached again."
          } >> "$GITHUB_STEP_SUMMARY"

  build-dotnet:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The version decided by prepare, into every manifest on this runner and over the "Next
      # release" heading of the notes that ship in the package. A no-op when git already says it.
      - name: Stamp the version
        run: scripts/version.sh stamp "$VERSION"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Each project is named explicitly: a plain-SDK project added later defaults IsPackable to
      # true and would otherwise ship a junk package. --source replaces Ark.oAuth.Oidc/nuget.config,
      # whose local Debug feed does not exist on a runner. GeneratePackageOnBuild=false because,
      # left on, the build step packs before the DLL is on disk and pack fails with NU5026.
      - name: Pack
        working-directory: Ark.oAuth.Oidc
        run: |
          for p in Ark.oAuth.Oidc/Ark.oAuth.Oidc.csproj Ark.oAuth.Client/Ark.oAuth.Client.csproj; do
            dotnet restore "$p" --source https://api.nuget.org/v3/index.json
            dotnet pack "$p" -c Release --no-restore -p:GeneratePackageOnBuild=false \
              -o "$GITHUB_WORKSPACE/out/nuget"
          done

      # nuget_deploy.txt STEP 5: the right files, and no application content leaking into consumers.
      - name: Verify packages
        working-directory: out/nuget
        run: |
          ls -l
          for id in Ark.oAuth.Oidc Ark.oAuth.Client; do
            for ext in nupkg snupkg; do
              [ -f "$id.$VERSION.$ext" ] || { echo "::error::missing $id.$VERSION.$ext"; exit 1; }
            done
            leaked=$(unzip -l "$id.$VERSION.nupkg" | grep -icE "content/|contentFiles/|staticwebassets" || true)
            [ "$leaked" = 0 ] || { echo "::error::$id ships $leaked content entries"; exit 1; }
            unzip -l "$id.$VERSION.nupkg" | grep -q " README.md$" || { echo "::error::$id has no README"; exit 1; }
          done
          [ "$(ls | wc -l)" = 4 ] || { echo "::error::expected exactly 4 files"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget
          path: out/nuget/
          if-no-files-found: error

  build-python:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        working-directory: ark_oauth_client_py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # As in build-dotnet. Before setup-uv, so `stamp` skips refreshing the gitignored uv.lock.
      - name: Stamp the version
        working-directory: .
        run: scripts/version.sh stamp "$VERSION"

      # uv.lock is gitignored, so the cache keys on pyproject.toml.
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          cache-dependency-glob: ark_oauth_client_py/pyproject.toml

      - name: Test
        run: uv run --extra dev pytest -q

      - name: Build
        run: |
          rm -rf dist
          uv build
          ls -l dist
          [ -f "dist/ark_oauth_client-$VERSION-py3-none-any.whl" ] && [ -f "dist/ark_oauth_client-$VERSION.tar.gz" ]

      - name: README renders on PyPI
        run: uvx twine check dist/*

      # pip_deploy.txt STEP 5e: run the suite against the INSTALLED wheel, which catches a module
      # left out of the wheel that the source tree would hide.
      - name: Test the built wheel
        run: |
          check="$RUNNER_TEMP/wheelcheck"
          mkdir -p "$check" && cp -r tests "$check/"
          wheel="$PWD/dist/ark_oauth_client-$VERSION-py3-none-any.whl"
          cd "$check"
          uv run --no-project --with "${wheel}[flask]" --with pytest -- pytest tests -q
          uv run --no-project --with "$wheel" -- python -c \
            "import ark_oauth_client as a, sys; sys.exit(0 if a.__version__ == '$VERSION' else 'wheel says ' + a.__version__)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python
          path: ark_oauth_client_py/dist/
          if-no-files-found: error

  build-node:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        working-directory: ark_oauth_client_nodejs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # As in build-dotnet.
      - name: Stamp the version
        working-directory: .
        run: scripts/version.sh stamp "$VERSION"

      # No runtime dependencies, so nothing to install before testing.
      - name: Test
        run: npm test

      - name: Pack
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out/npm-node"
          npm pack --pack-destination "$GITHUB_WORKSPACE/out/npm-node"
          ls -l "$GITHUB_WORKSPACE/out/npm-node"
          [ -f "$GITHUB_WORKSPACE/out/npm-node/ark-oauth-client-node-$VERSION.tgz" ]

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-node
          path: out/npm-node/
          if-no-files-found: error

  # The browser client, npm ark-oauth-client-js: a separate library from the Node client above.
  build-js:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        working-directory: ark_oauth_client_js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ark_oauth_client_js/package-lock.json

      # As in build-dotnet. Also stamps src/version.js and package-lock.json, so `npm ci` below
      # sees a lock file that agrees with package.json.
      - name: Stamp the version
        working-directory: .
        run: scripts/version.sh stamp "$VERSION"

      # Dev dependencies only: the React, Vue and Angular adapter tests, the typecheck and the
      # dist/ build. The package itself has no runtime dependencies.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      # prepack builds dist/ (gitignored) into the tarball.
      - name: Pack
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out/npm-js"
          npm pack --pack-destination "$GITHUB_WORKSPACE/out/npm-js"
          ls -l "$GITHUB_WORKSPACE/out/npm-js"
          [ -f "$GITHUB_WORKSPACE/out/npm-js/ark-oauth-client-js-$VERSION.tgz" ]

      # What ships: every file the exports map names (dist/ included, since it is built rather
      # than committed), nothing from test/, e2e/, examples/ or scripts/, and the packed code
      # itself reporting the version, since a browser cannot read package.json and src/version.js
      # holds it as a literal.
      - name: Verify the package
        run: |
          check="$RUNNER_TEMP/npm-js"
          rm -rf "$check" && mkdir -p "$check"
          tar -xzf "$GITHUB_WORKSPACE/out/npm-js/ark-oauth-client-js-$VERSION.tgz" -C "$check"
          cd "$check/package"
          leaked=$(find test e2e examples scripts node_modules -type f 2>/dev/null | wc -l)
          [ "$leaked" -eq 0 ] || { echo "::error::the tarball ships $leaked files from test/, e2e/, examples/, scripts/ or node_modules/"; exit 1; }
          node --input-type=module - <<'EOF'
          import { existsSync, readFileSync } from 'node:fs';
          const fail = (msg) => { console.log(`::error::${msg}`); process.exit(1); };
          const want = process.env.VERSION;
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          if (pkg.version !== want) fail(`package.json says ${pkg.version}, want ${want}`);
          const targets = (v) => typeof v === 'string' ? [v] : Object.values(v).flatMap(targets);
          const files = [pkg.main, pkg.types, pkg.unpkg, ...targets(pkg.exports)].filter((f) => !f.includes('*'));
          const missing = [...new Set(files)].filter((f) => !existsSync(f));
          if (missing.length) fail(`the tarball is missing ${missing.join(', ')}`);
          const { VERSION } = await import(new URL('src/index.js', `file://${process.cwd()}/`));
          if (VERSION !== want) fail(`src/version.js says ${VERSION}, want ${want}`);
          for (const f of ['dist/ark-oauth-client.global.js', 'dist/ark-oauth-client.global.min.js', 'dist/ark-oauth-client.esm.min.js']) {
            if (!readFileSync(f, 'utf8').startsWith(`/*! ark-oauth-client-js ${want} `)) fail(`${f} was not built for ${want}`);
          }
          console.log(`ark-oauth-client-js ${want}: ${files.length} entry files present, VERSION and dist/ agree`);
          EOF

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-js
          path: out/npm-js/
          if-no-files-found: error

  publish-nuget:
    needs: [prepare, build-dotnet, build-python, build-node, build-js]
    if: ${{ !inputs.dry_run && needs.prepare.outputs.nuget_live == 'false' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget
          path: nuget

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: NUGET_USER is set
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: '[ -n "$NUGET_USER" ] || { echo "::error::Set the NUGET_USER repository variable (see the setup notes at the top of release.yml)"; exit 1; }'

      # Trusted Publishing: swaps this run's OIDC token for an API key that lives about an hour.
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      # Pushing X.nupkg pushes X.snupkg beside it; pushing the .snupkg separately is a 409.
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for pkg in nuget/*.nupkg; do
            dotnet nuget push "$pkg" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

  publish-pypi:
    needs: [prepare, build-dotnet, build-python, build-node, build-js]
    if: ${{ !inputs.dry_run && needs.prepare.outputs.pypi_live == 'false' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python
          path: dist

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: false

      - name: Publish
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*

  # The two npm jobs below are the same steps for two separate packages: only `env` and the
  # artifact name differ. Each package has its own trusted publisher on npmjs.com (setup step d).
  publish-npm-node:
    needs: [prepare, build-dotnet, build-python, build-node, build-js]
    if: ${{ !inputs.dry_run && needs.prepare.outputs.npm_node_live == 'false' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    env:
      PACKAGE: ark-oauth-client-node
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-node
          path: npm

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm offers a trusted publisher only on a package that already exists, so the very first
      # version is published by hand (setup step d). Without this check that case fails inside
      # `npm publish` with ENEEDAUTH, which the run summary shows only as "exit code 1".
      - name: The package exists on npm
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$PACKAGE")
          if [ "$code" = 404 ]; then
            echo "::error::$PACKAGE has never been published to npm, so Trusted Publishing has nothing to attach to. Publish the first version by hand (setup step d at the top of release.yml), add the trusted publisher on npmjs.com, then re-run this job."
            exit 1
          fi
          [ "$code" = 200 ] || { echo "::error::registry.npmjs.org answered HTTP $code"; exit 1; }

      # Trusted Publishing needs npm 11.5.1 or later; provenance is attached automatically. npm's
      # own reason is raised as an annotation, because raw logs need auth to read. The tarball is
      # given as ./npm/...: a bare npm/x.tgz is read as the GitHub shorthand owner/repo, which
      # current npm refuses with EALLOWGIT.
      - name: Publish
        run: |
          set -o pipefail
          npm install -g npm@latest
          if ! npm publish ./npm/*.tgz --access public 2>&1 | tee "$RUNNER_TEMP/npm.log"; then
            reason=$(grep -m1 -E 'npm (error|ERR!) (code |404|403|401)|ENEEDAUTH|E40[134]' "$RUNNER_TEMP/npm.log" || true)
            echo "::error::npm publish of $PACKAGE failed: ${reason:-see the job log}. The package exists (the step above checked), so E404 on the PUT means no trusted publisher on npmjs.com matched this run and npm went on without credentials: add or correct the one for $PACKAGE with owner ir-dev, repository ark-oauth-oidc, workflow release.yml, environment release. E403 'OIDC permission denied for this action' means it matched but 'npm publish' is not ticked under Allowed actions (publishers created after 2026-09-03 allow only 'npm stage publish'). The OIDC token is minted per attempt, so 'Re-run failed jobs' picks up a fix made on npmjs.com."
            exit 1
          fi

  publish-npm-js:
    needs: [prepare, build-dotnet, build-python, build-node, build-js]
    if: ${{ !inputs.dry_run && needs.prepare.outputs.npm_js_live == 'false' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    env:
      PACKAGE: ark-oauth-client-js
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-js
          path: npm

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # As in publish-npm-node.
      - name: The package exists on npm
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$PACKAGE")
          if [ "$code" = 404 ]; then
            echo "::error::$PACKAGE has never been published to npm, so Trusted Publishing has nothing to attach to. Publish the first version by hand (setup step d at the top of release.yml), add the trusted publisher on npmjs.com, then re-run this job."
            exit 1
          fi
          [ "$code" = 200 ] || { echo "::error::registry.npmjs.org answered HTTP $code"; exit 1; }

      # As in publish-npm-node. The tarball already holds dist/: publishing a tarball runs no
      # prepack, so what was verified in build-js is exactly what ships.
      - name: Publish
        run: |
          set -o pipefail
          npm install -g npm@latest
          if ! npm publish ./npm/*.tgz --access public 2>&1 | tee "$RUNNER_TEMP/npm.log"; then
            reason=$(grep -m1 -E 'npm (error|ERR!) (code |404|403|401)|ENEEDAUTH|E40[134]' "$RUNNER_TEMP/npm.log" || true)
            echo "::error::npm publish of $PACKAGE failed: ${reason:-see the job log}. The package exists (the step above checked), so E404 on the PUT means no trusted publisher on npmjs.com matched this run and npm went on without credentials: add or correct the one for $PACKAGE with owner ir-dev, repository ark-oauth-oidc, workflow release.yml, environment release. E403 'OIDC permission denied for this action' means it matched but 'npm publish' is not ticked under Allowed actions (publishers created after 2026-09-03 allow only 'npm stage publish'). The OIDC token is minted per attempt, so 'Re-run failed jobs' picks up a fix made on npmjs.com."
            exit 1
          fi

  release:
    needs: [prepare, build-dotnet, build-python, build-node, build-js, publish-nuget, publish-pypi, publish-npm-node, publish-npm-js]
    # Skipped publish jobs (already live) are fine; a failed or cancelled one stops the release.
    if: ${{ !cancelled() && !failure() && !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      NUGET_LIVE: ${{ needs.prepare.outputs.nuget_live }}
      PYPI_LIVE: ${{ needs.prepare.outputs.pypi_live }}
      NPM_NODE_LIVE: ${{ needs.prepare.outputs.npm_node_live }}
      NPM_JS_LIVE: ${{ needs.prepare.outputs.npm_js_live }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # As in build-dotnet: the release notes below quote each changelog's entry for this
      # version, which in git may still be headed "Next release".
      - name: Stamp the version
        run: scripts/version.sh stamp "$VERSION"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: built

      # Attach only what this run published. A package that was live before the run was rebuilt
      # here, and the rebuild is not byte-identical to what the registry serves.
      - name: Collect assets
        run: |
          mkdir assets
          [ "$NUGET_LIVE" = true ] || cp built/nuget/* assets/
          [ "$PYPI_LIVE" = true ]  || cp built/python/* assets/
          [ "$NPM_NODE_LIVE" = true ] || cp built/npm-node/* assets/
          [ "$NPM_JS_LIVE" = true ]   || cp built/npm-js/* assets/
          if [ -n "$(ls assets)" ]; then
            (cd assets && sha256sum * > SHA256SUMS.txt)
          fi
          ls -l assets

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ hashFiles('assets/*') != '' }}
        with:
          subject-path: assets/*

      - name: Release notes
        run: |
          {
            echo "All packages at **$VERSION**, built from \`$GITHUB_SHA\`."
            echo
            echo "| Package | Registry | Install |"
            echo "|---|---|---|"
            echo "| Ark.oAuth.Oidc (IdP) | [nuget.org](https://www.nuget.org/packages/Ark.oAuth.Oidc/$VERSION) | \`dotnet add package Ark.oAuth.Oidc --version $VERSION\` |"
            echo "| Ark.oAuth.Client (.NET) | [nuget.org](https://www.nuget.org/packages/Ark.oAuth.Client/$VERSION) | \`dotnet add package Ark.oAuth.Client --version $VERSION\` |"
            echo "| ark-oauth-client (Python) | [PyPI](https://pypi.org/project/ark-oauth-client/$VERSION/) | \`pip install \"ark-oauth-client[flask]==$VERSION\"\` |"
            echo "| ark-oauth-client-node (Node) | [npm](https://www.npmjs.com/package/ark-oauth-client-node/v/$VERSION) | \`npm install ark-oauth-client-node@$VERSION\` |"
            echo "| ark-oauth-client-js (browser) | [npm](https://www.npmjs.com/package/ark-oauth-client-js/v/$VERSION) | \`npm install ark-oauth-client-js@$VERSION\` |"
            already=""
            [ "$NUGET_LIVE" = true ]    && already="$already, NuGet"
            [ "$PYPI_LIVE" = true ]     && already="$already, PyPI"
            [ "$NPM_NODE_LIVE" = true ] && already="$already, npm ark-oauth-client-node"
            [ "$NPM_JS_LIVE" = true ]   && already="$already, npm ark-oauth-client-js"
            if [ -n "$already" ]; then
              echo
              echo "Already on the registry before this release, so not attached here: ${already#, }."
            fi
            # The client changelogs are kept per version; quote each one's entry when there is one.
            for log in "Python|ark_oauth_client_py/CHANGELOG.md" "Node|ark_oauth_client_nodejs/CHANGELOG.md" "Browser|ark_oauth_client_js/CHANGELOG.md"; do
              entry=$(awk -v v="## $VERSION" '$0 == v {on=1; next} on && /^## / {exit} on' "${log#*|}")
              if [ -n "$entry" ]; then
                echo
                echo "## Changes — ${log%%|*} client"
                echo "$entry"
              fi
            done
          } > notes.md
          cat notes.md

      - name: Create the release and the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release create "v$VERSION" assets/* \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file notes.md \
            --generate-notes
          echo "Released [v$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION)" >> "$GITHUB_STEP_SUMMARY"
          # The stamp above changed tracked files, so git does not say this version yet.
          if ! git diff --quiet; then
            {
              echo
              echo "Git still describes the release before this one. Record $VERSION there before writing notes for the next release, or they are released again under the next number:"
              echo
              echo '```'
              echo "scripts/version.sh stamp $VERSION    # then commit and push"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
