# Release: build, test and publish the reusable packages at ONE version, then record it as a
# GitHub release.
#
#   NuGet  Ark.oAuth.Oidc, Ark.oAuth.Client   Ark.oAuth.Oidc/Ark.oAuth.{Oidc,Client}
#   PyPI   ark-oauth-client                    ark_oauth_client_py
#   npm    ark-oauth-client                    ark_oauth_client_nodejs
#
# HOW TO RELEASE
#   1. Write the notes (CHANGELOG.md, <PackageReleaseNotes>), commit and push.
#   2. Actions -> Release -> Run workflow, on that branch, typing the version to release.
#      Tick "dry run" to build and test without publishing.
#
# The version is either typed into the run or, left blank, read from the manifests:
#   typed  `scripts/version.sh set X.Y.Z` stamps it into every csproj, pyproject.toml,
#          __init__.py and package.json on each runner before building. Nothing is committed,
#          so the manifests in git may lag the release; the tag and the GitHub release record it.
#   blank  `scripts/version.sh check` fails the run unless every manifest already agrees.
# Either way a version is consumed only by a registry accepting it, so a failed run, a dry run
# or a re-run burns nothing. A registry that
# already has the version is skipped, not failed, so a half-finished release can be finished by
# re-running ("Re-run failed jobs" reuses the artifacts already built and published). The tag
# vX.Y.Z is created by the GitHub release, LAST, so a tag never names something unpublished.
#
# ONE-TIME SETUP -- no tokens anywhere; all three registries use Trusted Publishing (OIDC).
# Every registry is given the same four values: owner ir-dev, repository ark-oauth-oidc,
# workflow release.yml, environment release.
#   a. GitHub: Settings -> Environments -> New environment "release". Add yourself as a required
#      reviewer and/or restrict it to main if you want a click before anything leaves.
#   b. nuget.org: your profile menu -> Trusted Publishing -> Create policy.
#      Then GitHub: Settings -> Secrets and variables -> Actions -> Variables ->
#      NUGET_USER = your nuget.org profile name (the user name, not the email).
#   c. PyPI: pypi.org/manage/project/ark-oauth-client/settings/publishing -> add a GitHub publisher.
#   d. npm: ark-oauth-client has never been published, and npm offers a trusted publisher only on
#      a package that exists. Publish the first version by hand (`npm publish --access public` in
#      ark_oauth_client_nodejs), then npmjs.com -> the package -> Settings -> Trusted publisher.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, X.Y.Z (optional). Stamped into every package for this run; blank = what the manifests say."
        required: false
        default: ""
      dry_run:
        description: "Dry run: build, test and verify only; publish nothing, tag nothing."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      nuget_live: ${{ steps.live.outputs.nuget }}
      pypi_live: ${{ steps.live.outputs.pypi }}
      npm_live: ${{ steps.live.outputs.npm }}
    steps:
      - uses: actions/checkout@v7

      - name: The version to release
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        # A typed version is stamped here too, so a bad one (not X.Y.Z, or a manifest the stamp
        # cannot find) fails before anything builds; the build jobs repeat the stamp on their own
        # checkout. Assign rather than `echo "...$(cmd)"`, which swallows a failing check's exit
        # code and hands every later job an empty VERSION. The script's own reason is raised as
        # an annotation, since stderr alone shows only "exit code N" on the run summary.
        run: |
          fail() {
            cat "$RUNNER_TEMP/version.err" >&2
            reason=$(grep '^error:\|^no match' "$RUNNER_TEMP/version.err" | head -1 | sed 's/^error: //')
            echo "::error::${reason:-$1} (input was '$REQUESTED')"
            exit 1
          }
          requested=$(printf '%s' "$REQUESTED" | tr -d '[:space:]')
          requested=${requested#v}
          if [ -n "$requested" ]; then
            scripts/version.sh set "$requested" 2>"$RUNNER_TEMP/version.err" || fail "scripts/version.sh set failed"
          fi
          version=$(scripts/version.sh check "$requested" 2>"$RUNNER_TEMP/version.err") || fail "scripts/version.sh check failed"
          cat "$RUNNER_TEMP/version.err" >&2
          [ -n "$version" ] || { echo "::error::scripts/version.sh check printed no version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Not released yet
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          tag="v$VERSION"
          problem=""
          if gh release view "$tag" >/dev/null 2>&1; then
            problem="GitHub release $tag already exists. Bump with scripts/version.sh set."
          else
            at=$(git ls-remote origin "refs/tags/$tag^{}" "refs/tags/$tag" | head -1 | cut -f1)
            if [ -n "$at" ] && [ "$at" != "$GITHUB_SHA" ]; then
              problem="tag $tag already exists at $at, not at $GITHUB_SHA."
            fi
          fi
          if [ -n "$problem" ]; then
            if [ "$DRY_RUN" = "true" ]; then echo "::warning::$problem"; else echo "::error::$problem"; exit 1; fi
          fi
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::warning::Releasing from $GITHUB_REF_NAME, not main. The csproj files declare RepositoryBranch=main."
          fi

      - name: What the registries already have
        id: live
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # 200 -> true, 404 -> false, anything else stops the run rather than guessing.
          live() {
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$1")
            case "$code" in
              200) echo true ;;
              404) echo false ;;
              *) echo "::error::$1 answered HTTP $code" >&2; return 1 ;;
            esac
          }
          oidc=$(live "https://api.nuget.org/v3-flatcontainer/ark.oauth.oidc/$VERSION/ark.oauth.oidc.nuspec")
          client=$(live "https://api.nuget.org/v3-flatcontainer/ark.oauth.client/$VERSION/ark.oauth.client.nuspec")
          pypi=$(live "https://pypi.org/pypi/ark-oauth-client/$VERSION/json")
          npm=$(live "https://registry.npmjs.org/ark-oauth-client/$VERSION")
          if [ "$(live https://registry.npmjs.org/ark-oauth-client)" = false ]; then
            echo "::warning::ark-oauth-client has never been published to npm; publish-npm will stop until the first version is published by hand (setup step d)."
          fi
          # Both NuGet packages are pushed together; --skip-duplicate covers one being live already.
          nuget=$([ "$oidc" = true ] && [ "$client" = true ] && echo true || echo false)
          {
            echo "nuget=$nuget"
            echo "pypi=$pypi"
            echo "npm=$npm"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Release $VERSION from \`${GITHUB_SHA::7}\` ($GITHUB_REF_NAME)"
            echo
            echo "| Package | Already on the registry? |"
            echo "|---|---|"
            echo "| NuGet Ark.oAuth.Oidc | $oidc |"
            echo "| NuGet Ark.oAuth.Client | $client |"
            echo "| PyPI ark-oauth-client | $pypi |"
            echo "| npm ark-oauth-client | $npm |"
            echo
            echo "Packages already live are built and tested, but not published or attached again."
          } >> "$GITHUB_STEP_SUMMARY"

  build-dotnet:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # The version decided by prepare, into every manifest on this runner. A no-op when the
      # manifests already say it.
      - name: Stamp the version
        run: scripts/version.sh set "$VERSION"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      # Each project is named explicitly: a plain-SDK project added later defaults IsPackable to
      # true and would otherwise ship a junk package. --source replaces Ark.oAuth.Oidc/nuget.config,
      # whose local Debug feed does not exist on a runner. GeneratePackageOnBuild=false because,
      # left on, the build step packs before the DLL is on disk and pack fails with NU5026.
      - name: Pack
        working-directory: Ark.oAuth.Oidc
        run: |
          for p in Ark.oAuth.Oidc/Ark.oAuth.Oidc.csproj Ark.oAuth.Client/Ark.oAuth.Client.csproj; do
            dotnet restore "$p" --source https://api.nuget.org/v3/index.json
            dotnet pack "$p" -c Release --no-restore -p:GeneratePackageOnBuild=false \
              -o "$GITHUB_WORKSPACE/out/nuget"
          done

      # nuget_deploy.txt STEP 5: the right files, and no application content leaking into consumers.
      - name: Verify packages
        working-directory: out/nuget
        run: |
          ls -l
          for id in Ark.oAuth.Oidc Ark.oAuth.Client; do
            for ext in nupkg snupkg; do
              [ -f "$id.$VERSION.$ext" ] || { echo "::error::missing $id.$VERSION.$ext"; exit 1; }
            done
            leaked=$(unzip -l "$id.$VERSION.nupkg" | grep -icE "content/|contentFiles/|staticwebassets" || true)
            [ "$leaked" = 0 ] || { echo "::error::$id ships $leaked content entries"; exit 1; }
            unzip -l "$id.$VERSION.nupkg" | grep -q " README.md$" || { echo "::error::$id has no README"; exit 1; }
          done
          [ "$(ls | wc -l)" = 4 ] || { echo "::error::expected exactly 4 files"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: out/nuget/
          if-no-files-found: error

  build-python:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        working-directory: ark_oauth_client_py
    steps:
      - uses: actions/checkout@v7

      # As in build-dotnet. Before setup-uv, so `set` skips refreshing the gitignored uv.lock.
      - name: Stamp the version
        working-directory: .
        run: scripts/version.sh set "$VERSION"

      # uv.lock is gitignored, so the cache keys on pyproject.toml.
      - uses: astral-sh/setup-uv@v7
        with:
          cache-dependency-glob: ark_oauth_client_py/pyproject.toml

      - name: Test
        run: uv run --extra dev pytest -q

      - name: Build
        run: |
          rm -rf dist
          uv build
          ls -l dist
          [ -f "dist/ark_oauth_client-$VERSION-py3-none-any.whl" ] && [ -f "dist/ark_oauth_client-$VERSION.tar.gz" ]

      - name: README renders on PyPI
        run: uvx twine check dist/*

      # pip_deploy.txt STEP 5e: run the suite against the INSTALLED wheel, which catches a module
      # left out of the wheel that the source tree would hide.
      - name: Test the built wheel
        run: |
          check="$RUNNER_TEMP/wheelcheck"
          mkdir -p "$check" && cp -r tests "$check/"
          wheel="$PWD/dist/ark_oauth_client-$VERSION-py3-none-any.whl"
          cd "$check"
          uv run --no-project --with "${wheel}[flask]" --with pytest -- pytest tests -q
          uv run --no-project --with "$wheel" -- python -c \
            "import ark_oauth_client as a, sys; sys.exit(0 if a.__version__ == '$VERSION' else 'wheel says ' + a.__version__)"

      - uses: actions/upload-artifact@v7
        with:
          name: python
          path: ark_oauth_client_py/dist/
          if-no-files-found: error

  build-node:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    defaults:
      run:
        working-directory: ark_oauth_client_nodejs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # As in build-dotnet.
      - name: Stamp the version
        working-directory: .
        run: scripts/version.sh set "$VERSION"

      # No runtime dependencies, so nothing to install before testing.
      - name: Test
        run: npm test

      - name: Pack
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out/npm"
          npm pack --pack-destination "$GITHUB_WORKSPACE/out/npm"
          ls -l "$GITHUB_WORKSPACE/out/npm"
          [ -f "$GITHUB_WORKSPACE/out/npm/ark-oauth-client-$VERSION.tgz" ]

      - uses: actions/upload-artifact@v7
        with:
          name: npm
          path: out/npm/
          if-no-files-found: error

  publish-nuget:
    needs: [prepare, build-dotnet, build-python, build-node]
    if: ${{ !inputs.dry_run && needs.prepare.outputs.nuget_live == 'false' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nuget
          path: nuget

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: NUGET_USER is set
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: '[ -n "$NUGET_USER" ] || { echo "::error::Set the NUGET_USER repository variable (see the setup notes at the top of release.yml)"; exit 1; }'

      # Trusted Publishing: swaps this run's OIDC token for an API key that lives about an hour.
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_USER }}

      # Pushing X.nupkg pushes X.snupkg beside it; pushing the .snupkg separately is a 409.
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for pkg in nuget/*.nupkg; do
            dotnet nuget push "$pkg" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

  publish-pypi:
    needs: [prepare, build-dotnet, build-python, build-node]
    if: ${{ !inputs.dry_run && needs.prepare.outputs.pypi_live == 'false' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python
          path: dist

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Publish
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/*

  publish-npm:
    needs: [prepare, build-dotnet, build-python, build-node]
    if: ${{ !inputs.dry_run && needs.prepare.outputs.npm_live == 'false' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: npm
          path: npm

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm offers a trusted publisher only on a package that already exists, so the very first
      # version is published by hand (setup step d). Without this check that case fails inside
      # `npm publish` with ENEEDAUTH, which the run summary shows only as "exit code 1".
      - name: The package exists on npm
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' https://registry.npmjs.org/ark-oauth-client)
          if [ "$code" = 404 ]; then
            echo "::error::ark-oauth-client has never been published to npm, so Trusted Publishing has nothing to attach to. Publish the first version by hand (setup step d at the top of release.yml), add the trusted publisher on npmjs.com, then re-run this job."
            exit 1
          fi
          [ "$code" = 200 ] || { echo "::error::registry.npmjs.org answered HTTP $code"; exit 1; }

      # Trusted Publishing needs npm 11.5.1 or later; provenance is attached automatically. npm's
      # own reason is raised as an annotation, because raw logs need auth to read.
      - name: Publish
        run: |
          set -o pipefail
          npm install -g npm@latest
          if ! npm publish npm/*.tgz --access public 2>&1 | tee "$RUNNER_TEMP/npm.log"; then
            reason=$(grep -m1 -E 'npm (error|ERR!) (code |404|403|401)|ENEEDAUTH|E40[134]' "$RUNNER_TEMP/npm.log" || true)
            echo "::error::npm publish failed: ${reason:-see the job log}. If it is an auth error, check the trusted publisher on npmjs.com: owner ir-dev, repository ark-oauth-oidc, workflow release.yml, environment release."
            exit 1
          fi

  release:
    needs: [prepare, build-dotnet, build-python, build-node, publish-nuget, publish-pypi, publish-npm]
    # Skipped publish jobs (already live) are fine; a failed or cancelled one stops the release.
    if: ${{ !cancelled() && !failure() && !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      NUGET_LIVE: ${{ needs.prepare.outputs.nuget_live }}
      PYPI_LIVE: ${{ needs.prepare.outputs.pypi_live }}
      NPM_LIVE: ${{ needs.prepare.outputs.npm_live }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: built

      # Attach only what this run published. A package that was live before the run was rebuilt
      # here, and the rebuild is not byte-identical to what the registry serves.
      - name: Collect assets
        run: |
          mkdir assets
          [ "$NUGET_LIVE" = true ] || cp built/nuget/* assets/
          [ "$PYPI_LIVE" = true ]  || cp built/python/* assets/
          [ "$NPM_LIVE" = true ]   || cp built/npm/* assets/
          if [ -n "$(ls assets)" ]; then
            (cd assets && sha256sum * > SHA256SUMS.txt)
          fi
          ls -l assets

      - uses: actions/attest-build-provenance@v4
        if: ${{ hashFiles('assets/*') != '' }}
        with:
          subject-path: assets/*

      - name: Release notes
        run: |
          {
            echo "All packages at **$VERSION**, built from \`$GITHUB_SHA\`."
            echo
            echo "| Package | Registry | Install |"
            echo "|---|---|---|"
            echo "| Ark.oAuth.Oidc (IdP) | [nuget.org](https://www.nuget.org/packages/Ark.oAuth.Oidc/$VERSION) | \`dotnet add package Ark.oAuth.Oidc --version $VERSION\` |"
            echo "| Ark.oAuth.Client (.NET) | [nuget.org](https://www.nuget.org/packages/Ark.oAuth.Client/$VERSION) | \`dotnet add package Ark.oAuth.Client --version $VERSION\` |"
            echo "| ark-oauth-client (Python) | [PyPI](https://pypi.org/project/ark-oauth-client/$VERSION/) | \`pip install \"ark-oauth-client[flask]==$VERSION\"\` |"
            echo "| ark-oauth-client (Node) | [npm](https://www.npmjs.com/package/ark-oauth-client/v/$VERSION) | \`npm install ark-oauth-client@$VERSION\` |"
            already=""
            [ "$NUGET_LIVE" = true ] && already="$already NuGet"
            [ "$PYPI_LIVE" = true ]  && already="$already PyPI"
            [ "$NPM_LIVE" = true ]   && already="$already npm"
            if [ -n "$already" ]; then
              echo
              echo "Already on the registry before this release, so not attached here:$already."
            fi
            # The client changelogs are kept per version; quote each one's entry when there is one.
            for log in "Python|ark_oauth_client_py/CHANGELOG.md" "Node|ark_oauth_client_nodejs/CHANGELOG.md"; do
              entry=$(awk -v v="## $VERSION" '$0 == v {on=1; next} on && /^## / {exit} on' "${log#*|}")
              if [ -n "$entry" ]; then
                echo
                echo "## Changes — ${log%%|*} client"
                echo "$entry"
              fi
            done
          } > notes.md
          cat notes.md

      - name: Create the release and the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release create "v$VERSION" assets/* \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --notes-file notes.md \
            --generate-notes
          echo "Released [v$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION)" >> "$GITHUB_STEP_SUMMARY"
